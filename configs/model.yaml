# Modelling configuration (PLAN §7).
#
# Not covered by the sim-v1 freeze: this is how models are fitted and judged, not what
# the data is.

# Analyst capacity. Alerts may be at most this share of transactions (PLAN §7.7).
# Everything at the operating point is chosen subject to this, which is why the headline
# metric is recall within budget rather than accuracy.
review_budget: 0.02

hold:
  # HOLD freezes a genuine customer's card, so it is reserved for high precision.
  min_precision: 0.95
  # Below this many alerts the precision estimate is noise, and HOLD is disabled.
  min_alerts: 50

rules:
  # R1-R4 exactly as PLAN §7.3 defines them. This is the reference point ML has to
  # beat, so a deliberately weak baseline would flatter every model that follows.
  # May be tuned with a small grid on TRAIN only; the chosen values are recorded here.
  r1_velocity:
    acct_cnt_5m: 5
  r2_ato:
    geo_speed_kmh: 900.0
    new_device: 1
  r3_card_testing:
    dev_accts_1h: 5
    acct_small_1h: 3
    acct_declines_1h: 2
  r4_ring:
    dev_accts_30d: 3
    account_age_days: 30

xgboost:
  # PLAN §7.4. No scale_pos_weight: the probability gets blended with an anomaly
  # percentile later, and reweighting would distort it and make the blend weight
  # meaningless (§3.8).
  fixed:
    objective: binary:logistic
    tree_method: hist
    enable_categorical: true
    eval_metric: aucpr
    n_estimators: 2000
    early_stopping_rounds: 100
    random_state: 42
  # 20 configurations sampled from this grid, seeded so the search is reproducible.
  search_trials: 20
  search_seed: 42
  grid:
    max_depth: [4, 6, 8]
    learning_rate: [0.03, 0.05, 0.1]
    min_child_weight: [1, 5, 10]
    subsample: [0.7, 0.9]
    colsample_bytree: [0.6, 0.9]
    reg_lambda: [1, 5]
