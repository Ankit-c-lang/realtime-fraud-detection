# Tiny simulator configuration, used by the test suite ONLY (PLAN §4.8, §13).
#
# It keeps the SAME 90-day calendar as sim.yaml, so configs/splits.yaml applies
# unchanged and every structural check runs against it. Only the population and
# the attack volumes shrink, which is what makes it fast.
#
# This file must keep the same key structure as sim.yaml; a test asserts that,
# so a knob added to one cannot be forgotten in the other.
#
# The ring constraints are necessarily weaker here. Requiring >= 12 rings in the
# test window would force ~40 rings, and 40 rings in a 20K-event dataset would
# push fraud prevalence far past 2%. checks.py reads these thresholds from the
# config, so the same check code serves both files.

seed: 1337
generator_version: 1

start: 2026-01-01
days: 90
timezone: Asia/Kolkata

target_transactions: 20000
target_tolerance: 0.10

cities_file: cities.csv
categories_file: categories.yaml

accounts:
  n: 1200
  existing_share: 0.90
  existing_created_start: 2023-01-01
  existing_created_end: 2025-12-31
  activity_rate:
    median_per_day: 0.18
    sigma: 0.80
  spend_level:
    median: 1.0
    sigma: 0.50
  regular_merchants_min: 3
  regular_merchants_max: 8
  regular_share: 0.70

merchants:
  n: 200
  zipf_exponent: 1.10
  international_share: 0.05
  n_low_friction: 5
  low_friction_categories: [digital_goods]
  n_colluding: 10
  colluding_categories: [electronics, gift_cards_wallet, digital_goods]

devices:
  two_device_share: 0.15
  upgrade_share: 0.05
  family_share: 0.08
  family_size_min: 2
  family_size_max: 4
  family_device_share: 0.40

ip_pools:
  carrier_nat:
    n_ips: 8
    account_share: 0.45
    usage_share: 0.50
  office:
    n_ips: 10
    account_share: 0.25
    group_size_min: 5
    group_size_max: 60
    group_size_alpha: 1.60
    active_hours: [9, 18]
    weekdays_only: true
  vpn:
    n_ips: 3
    account_share: 0.02
    usage_share: 0.10

legit:
  weekday_factor: [1.00, 0.98, 1.00, 1.05, 1.20, 1.30, 1.10]
  diurnal:
    peaks_hour: [13.0, 20.0]
    peaks_sigma: [2.2, 2.4]
    peaks_weight: [0.45, 0.45]
    uniform_weight: 0.10
    quiet_hours: [1, 6]
    quiet_factor: 0.15
  night_owl_share: 0.05
  night_owl_shift_hours: 5.0
  decline_rate: 0.015
  decline_amount_exponent: 0.35
  decline_rate_max: 0.08

hard_negatives:
  travel:
    account_share: 0.04
    trip_days_min: 2
    trip_days_max: 7
    domestic_share: 0.75
    min_gap_hours_domestic: 2.0
    min_gap_hours_international: 6.0
  shopping_spree:
    account_day_share: 0.02
    extra_txns_min: 4
    extra_txns_max: 8
    window_minutes: 90
    merchants_min: 2
    merchants_max: 5
  micro_burst:
    account_share: 0.03
    episodes_min: 1
    episodes_max: 3
    txns_min: 5
    txns_max: 12
    window_minutes: 60
    amount_max: 100.0

patterns:
  velocity:
    n_attacks: 3
    target_transactions: 45
    txns_min: 10
    txns_max: 30
    window_minutes_min: 3
    window_minutes_max: 15
    merchants_min: 1
    merchants_max: 4
    categories: [ecommerce, digital_goods, gift_cards_wallet]
    new_device_share: 0.70
    amount_median: 2500.0
    amount_sigma: 0.70
    amount_cap: 20000.0
    decline_rate_min: 0.05
    decline_rate_max: 0.15

  ato:
    n_attacks: 6
    target_transactions: 30
    victim_min_prior_txns: 5
    txns_min: 3
    txns_max: 8
    window_minutes_min: 30
    window_minutes_max: 180
    categories: [electronics, gift_cards_wallet, travel]
    foreign_ip_share: 0.60
    lag_after_legit_minutes_min: 5
    lag_after_legit_minutes_max: 60
    amount_mult_min: 3.0
    amount_mult_max: 10.0
    amount_cap: 150000.0
    decline_rate: 0.10

  card_testing:
    n_attacks: 2
    target_transactions: 50
    victims_min: 20
    victims_max: 30
    window_minutes_min: 20
    window_minutes_max: 60
    merchants_min: 1
    merchants_max: 2
    vpn_share: 0.50
    amount_min: 1.0
    amount_max: 50.0
    decline_rate_min: 0.40
    decline_rate_max: 0.60
    cashout_share: 0.30
    cashout_delay_hours_min: 1
    cashout_delay_hours_max: 12
    cashout_amount_min: 5000.0
    cashout_amount_max: 40000.0
    cashout_categories: [electronics, gift_cards_wallet]

  ring:
    n_rings: 8
    target_transactions: 200
    accounts_min: 4
    accounts_max: 6
    account_age_days_min: 3
    account_age_days_max: 30
    devices_min: 2
    devices_max: 3
    ips_min: 1
    ips_max: 2
    active_days_min: 5
    active_days_max: 25
    txns_per_account_min: 4
    txns_per_account_max: 6
    colluding_share: 0.60
    device_reuse_share: 0.30
    device_reuse_lookback_days: 30
    min_rings_in_test: 1
    min_rings_in_test_with_device_reuse: 0
    min_rings_fully_in_train: 3

labels:
  delay_days: 14

output:
  compression: zstd
  txn_id_format: "T{:07d}"
